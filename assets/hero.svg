<svg xmlns="http://www.w3.org/2000/svg" width="880" height="520" viewBox="0 0 880 520" role="img" aria-label="Cartoon: a coding agent with the top of its head open, while a gloved hand slots in a small brain labelled explore / haiku. Larger brains labelled plan / opus and review / sonnet sit on a tray.">
  <defs>
    <style>
      .ink{stroke:#1d1d1f;stroke-width:5;stroke-linejoin:round;stroke-linecap:round}
      .thin{stroke:#1d1d1f;stroke-width:3.2;stroke-linejoin:round;stroke-linecap:round;fill:none}
      .tag{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:15px;font-weight:700;fill:#1d1d1f}
      .cap{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:30px;font-weight:800;fill:#1d1d1f;letter-spacing:-0.5px}
      .sub{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;fill:#4a4a4f}
    </style>
    <!-- a brain: blob with sulci; scaled per use -->
    <g id="brain">
      <path class="ink" fill="#f7a8c4" d="M-60 6c-18-4-28-24-18-40 8-14 24-18 36-12 6-16 30-22 42-10 10-10 30-10 40 2 14-6 34 2 36 20 12 4 16 22 6 32 2 14-12 26-28 22-8 14-30 16-40 4-10 10-30 8-40-2-14 8-32 0-34-16z"/>
      <path class="thin" d="M-40-20c8 8 4 22-6 28M-12-28c10 6 10 24 0 32M18-26c-8 10-4 24 6 30M46-12c-10 8-8 22 2 28M-26 16c10-2 20 2 28 10M12 18c8-4 18-2 24 6"/>
      <path class="thin" d="M2-34c-4 20-4 44 0 62"/>
    </g>
  </defs>

  <!-- card -->
  <rect width="880" height="520" rx="22" fill="#fff6e8"/>
  <rect x="0" y="400" width="880" height="120" fill="#ffe9c9"/>
  <ellipse cx="300" cy="412" rx="240" ry="18" fill="#e8d2b2"/>

  <!-- the agent: body -->
  <path class="ink" fill="#9ec9ff" d="M190 400c0-60 40-96 110-96s110 36 110 96z"/>
  <!-- collar with a prompt caret -->
  <rect x="260" y="330" width="80" height="34" rx="8" class="ink" fill="#1d1d1f"/>
  <text x="300" y="355" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="22" font-weight="700" fill="#9ef0b0">&gt;_</text>

  <!-- head -->
  <path class="ink" fill="#ffd9a8" d="M180 170c0-40 54-62 120-62s120 22 120 62v110c0 36-54 56-120 56s-120-20-120-56z"/>
  <!-- cut line where the lid came off -->
  <path class="thin" d="M180 176h240" stroke-dasharray="10 8"/>
  <!-- hollow inside the head -->
  <path class="ink" fill="#f1c3a0" d="M196 172c0-18 46-30 104-30s104 12 104 30c0 18-46 30-104 30s-104-12-104-30z"/>
  <!-- empty slot rails -->
  <path class="thin" d="M232 172h24M344 172h24"/>

  <!-- the lid, a dome hinged open on the left -->
  <g transform="rotate(-30 182 172)">
    <path class="ink" fill="#ffd9a8" d="M182 172c0-44 54-70 118-70s118 26 118 70z"/>
    <!-- a hair tuft -->
    <path class="thin" d="M292 104c-4-16 4-26 12-30M310 102c2-14 12-20 20-22"/>
  </g>
  <!-- hinge -->
  <circle cx="182" cy="170" r="7" class="ink" fill="#1d1d1f"/>

  <!-- face -->
  <ellipse cx="258" cy="236" rx="10" ry="13" fill="#1d1d1f"/>
  <ellipse cx="342" cy="236" rx="10" ry="13" fill="#1d1d1f"/>
  <circle cx="262" cy="231" r="3.5" fill="#fff"/>
  <circle cx="346" cy="231" r="3.5" fill="#fff"/>
  <path class="thin" d="M278 282c12 12 32 12 44 0"/>
  <!-- a bandage, the lobotomy nod -->
  <g transform="rotate(-22 392 262)">
    <rect x="364" y="254" width="56" height="16" rx="5" class="ink" fill="#ffffff"/>
    <path class="thin" d="M380 258v8M392 258v8M404 258v8"/>
  </g>

  <!-- brain going in, held by tweezers -->
  <g transform="translate(300 150) scale(0.62)">
    <use href="#brain"/>
  </g>
  <!-- tweezers held by a gloved hand -->
  <path class="ink" fill="none" stroke-width="6" d="M318 142l100-56M326 152l94-64"/>
  <circle cx="428" cy="84" r="5" fill="#1d1d1f"/>
  <!-- glove: palm, thumb, fingers -->
  <path class="ink" fill="#7fd1b9" d="M438 50c18-12 44-10 58 6 10 12 10 30 0 42-6 8-16 12-26 12-10 10-26 10-36 2-6-6-8-14-4-20-10-4-14-18-6-26 4-6 8-12 14-16z"/>
  <path class="ink" fill="#7fd1b9" d="M428 94c-12 2-24-6-26-18-2-10 6-18 16-16 8 2 14 12 14 20s-2 12-4 14z"/>
  <path class="thin" d="M466 66c8 2 14 10 14 20M482 60c6 2 10 6 12 12M452 100c8 0 14-4 18-10"/>
  <!-- sleeve -->
  <path class="ink" fill="#ffffff" d="M486 40c22-20 62-38 112-44v76c-40 2-72 12-96 30z"/>
  <!-- the tray with the other brains -->
  <rect x="520" y="300" width="330" height="18" rx="6" class="ink" fill="#c9d9ea"/>
  <rect x="540" y="318" width="14" height="80" class="ink" fill="#9bb2cc"/>
  <rect x="816" y="318" width="14" height="80" class="ink" fill="#9bb2cc"/>

  <g transform="translate(600 248) scale(1.0)"><use href="#brain"/></g>
  <g transform="translate(760 262) scale(0.78)"><use href="#brain"/></g>

  <!-- tags -->
  <g>
    <rect x="552" y="330" width="104" height="46" rx="8" class="ink" fill="#ffffff"/>
    <text class="tag" x="604" y="349" text-anchor="middle">plan</text>
    <text class="tag" x="604" y="368" text-anchor="middle" fill="#6b4ce6">opus</text>
  </g>
  <g>
    <rect x="712" y="330" width="104" height="46" rx="8" class="ink" fill="#ffffff"/>
    <text class="tag" x="764" y="349" text-anchor="middle">review</text>
    <text class="tag" x="764" y="368" text-anchor="middle" fill="#1f7ae0">sonnet</text>
  </g>
  <g>
    <rect x="236" y="68" width="110" height="46" rx="8" class="ink" fill="#ffffff"/>
    <text class="tag" x="291" y="87" text-anchor="middle">explore</text>
    <text class="tag" x="291" y="106" text-anchor="middle" fill="#13a37a">haiku</text>
    <path class="thin" d="M291 114v18"/>
  </g>

  <!-- caption -->
  <text class="cap" x="440" y="466" text-anchor="middle">One brain per task.</text>
  <text class="sub" x="440" y="494" text-anchor="middle">Plan on the big one. Explore on the cheap one. Nobody needs a frontier model to name a branch.</text>
</svg>
