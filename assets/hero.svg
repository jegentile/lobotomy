<svg xmlns="http://www.w3.org/2000/svg" width="880" height="420" viewBox="0 0 880 420" role="img" aria-label="Cartoon: a coding agent with the top of its head open while a gloved hand slots in a small brain tagged explore / haiku. Bigger brains tagged plan / opus and review / sonnet wait on a tray.">
  <defs>
    <style>
      .ink{stroke:#1d1d1f;stroke-width:5;stroke-linejoin:round;stroke-linecap:round;fill:#fff}
      .thin{stroke:#1d1d1f;stroke-width:3.2;stroke-linejoin:round;stroke-linecap:round;fill:none}
      .pink{fill:#f7a8c4}
      .tag{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:15px;font-weight:700;fill:#1d1d1f}
    </style>
    <g id="brain">
      <path class="ink pink" d="M-60 6c-18-4-28-24-18-40 8-14 24-18 36-12 6-16 30-22 42-10 10-10 30-10 40 2 14-6 34 2 36 20 12 4 16 22 6 32 2 14-12 26-28 22-8 14-30 16-40 4-10 10-30 8-40-2-14 8-32 0-34-16z"/>
      <path class="thin" d="M-40-20c8 8 4 22-6 28M-12-28c10 6 10 24 0 32M18-26c-8 10-4 24 6 30M46-12c-10 8-8 22 2 28M-26 16c10-2 20 2 28 10M12 18c8-4 18-2 24 6"/>
      <path class="thin" d="M2-34c-4 20-4 44 0 62"/>
    </g>
  </defs>

  <!-- body + prompt badge -->
  <path class="ink" d="M190 400c0-60 40-96 110-96s110 36 110 96z"/>
  <rect x="262" y="332" width="76" height="32" rx="8" style="fill:#1d1d1f;stroke:#fff;stroke-width:3"/>
  <text x="300" y="356" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="21" font-weight="700" fill="#fff">&gt;_</text>

  <!-- head: rounded, with side bolts -->
  <circle cx="176" cy="226" r="16" class="ink"/>
  <circle cx="424" cy="226" r="16" class="ink"/>
  <path class="thin" d="M170 226h12M418 226h12"/>
  <path class="ink" d="M184 172c0-40 50-62 116-62s116 22 116 62v98c0 44-40 70-116 70s-116-26-116-70z"/>
  <path class="ink" d="M198 172c0-18 46-30 102-30s102 12 102 30c0 18-46 30-102 30s-102-12-102-30z"/>
  <!-- lid on a hinge, with an antenna -->
  <g transform="rotate(-30 184 172)">
    <path class="ink" d="M184 172c0-44 52-70 116-70s116 26 116 70z"/>
    <path class="thin" d="M300 102v-26"/>
    <circle cx="300" cy="68" r="9" class="ink pink"/>
  </g>
  <circle cx="184" cy="172" r="7" class="ink"/>

  <!-- face: LED eyes, small smile -->
  <rect x="240" y="222" width="34" height="26" rx="8" fill="#1d1d1f"/>
  <rect x="326" y="222" width="34" height="26" rx="8" fill="#1d1d1f"/>
  <rect x="248" y="228" width="10" height="7" rx="3" fill="#fff"/>
  <rect x="334" y="228" width="10" height="7" rx="3" fill="#fff"/>
  <path class="thin" d="M282 282c10 10 26 10 36 0"/>

  <!-- small brain going in -->
  <g transform="translate(300 150) scale(0.62)"><use href="#brain"/></g>
  <!-- tweezers, glove, sleeve -->
  <path d="M318 142l100-56M326 152l94-64" stroke="#fff" stroke-width="12" stroke-linecap="round" fill="none"/>
  <path class="thin" stroke-width="6" d="M318 142l100-56M326 152l94-64"/>
  <circle cx="428" cy="84" r="6" class="ink" stroke-width="3"/>
  <path class="ink" d="M438 50c18-12 44-10 58 6 10 12 10 30 0 42-6 8-16 12-26 12-10 10-26 10-36 2-6-6-8-14-4-20-10-4-14-18-6-26 4-6 8-12 14-16z"/>
  <path class="ink" d="M428 94c-12 2-24-6-26-18-2-10 6-18 16-16 8 2 14 12 14 20s-2 12-4 14z"/>
  <path class="thin" d="M466 66c8 2 14 10 14 20M482 60c6 2 10 6 12 12"/>
  <path class="ink" d="M486 40c22-20 62-38 112-44v76c-40 2-72 12-96 30z"/>

  <!-- tray with the other brains -->
  <rect x="520" y="300" width="330" height="18" rx="6" class="ink"/>
  <rect x="540" y="318" width="14" height="80" class="ink"/>
  <rect x="816" y="318" width="14" height="80" class="ink"/>
  <g transform="translate(600 248)"><use href="#brain"/></g>
  <g transform="translate(760 262) scale(0.78)"><use href="#brain"/></g>

  <!-- tags -->
  <rect x="552" y="330" width="104" height="46" rx="8" class="ink"/>
  <text class="tag" x="604" y="349" text-anchor="middle">plan</text>
  <text class="tag" x="604" y="368" text-anchor="middle">opus</text>
  <rect x="712" y="330" width="104" height="46" rx="8" class="ink"/>
  <text class="tag" x="764" y="349" text-anchor="middle">review</text>
  <text class="tag" x="764" y="368" text-anchor="middle">sonnet</text>
  <rect x="236" y="68" width="110" height="46" rx="8" class="ink"/>
  <text class="tag" x="291" y="87" text-anchor="middle">explore</text>
  <text class="tag" x="291" y="106" text-anchor="middle">haiku</text>
</svg>
